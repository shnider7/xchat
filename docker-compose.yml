services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chatflow
      POSTGRES_PASSWORD: chatflow
      POSTGRES_DB: chatflow
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chatflow:chatflow@db:5432/chatflow
      REDIS_URL: redis://redis:6379
    depends_on: [db, redis]
    ports: ["3333:3333"]
volumes:
  pgdata: